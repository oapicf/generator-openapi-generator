---
name: Upgrade Dependencies
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: $\{{ secrets.{{github_token_prefix}}_GITHUB_TOKEN }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make update-to-latest && make update-dotfiles update-partials'
          image: cliffano/studio:4.0.0
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make deps-upgrade'
          image: cliffano/studio:4.0.0
      - uses: iamsauravsharma/create-dotenv@v2.0.1
        with:
          file-path: '/tmp/.env'
        env:
          GITHUB_ACTIONS: $\{{ env.GITHUB_ACTIONS }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make ci'
          image: cliffano/studio:4.0.0
          # based on https://github.com/cliffano/packer-studio/blob/main/provisioners/shell/info-post.sh#L5
          # TODO: replace /root with studio-user's home when available
          extra_path: '/root/.cargo/bin:/root/.local/bin:/root/go/bin:/opt/poetry-venv/bin:/opt/poetry/bin:/usr/local/go/bin:/usr/local/maven/bin:/usr/local/node/bin:/usr/local/openjdk-jdk/bin'
          env_file: '/tmp/.env'
      - uses: cliffano/save-changes-action@v2.0.0
        with:
          message: "Upgrade dependencies to latest"
          github_token: $\{{ secrets.{{github_token_prefix}}_GITHUB_TOKEN }}